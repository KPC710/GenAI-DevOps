name: CI Pipeline
on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phase-1/genai-devops-demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest
