name: AI DevOps Pipeline

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phase-5/genai-devops-agent

    steps:
      # ---------------------------------------
      # Checkout
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # Python
      # ---------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------
      # Install dependencies
      # ---------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------
      # Run tests
      # ---------------------------------------
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee ci-output.txt

      # ---------------------------------------
      # Start AI Agent
      # ---------------------------------------
      - name: Run AI DevOps Agent
        if: steps.tests.outcome == 'failure'
        id: agent
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python agent.py < ci-output.txt | tee ai-analysis.txt

      # ---------------------------------------
      # Show changes
      # ---------------------------------------
      - name: Git status
        if: steps.agent.outcome == 'success'
        run: |
          git status
          git diff

      # ---------------------------------------
      # Create AI branch
      # ---------------------------------------
      - name: Create AI branch
        if: steps.agent.outcome == 'success'
        run: |
          BRANCH="ai-fix-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add app.py

          if git diff --cached --quiet; then
            echo "AI agent completed without producing an app.py change."
            exit 1
          fi

          git config user.name "GenAI DevOps Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: AI generated CI repair"
          git push origin "$BRANCH"
          echo "AI_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # ---------------------------------------
      # Create Pull Request
      # ---------------------------------------
      - name: Create Pull Request
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "$AI_BRANCH" \
            --title "AI generated CI fix" \
            --body-file ai-analysis.txt

      # ---------------------------------------
      # Upload logs
      # ---------------------------------------
      - name: Upload AI analysis
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ai-devops-analysis
          path: |
            ci-output.txt
            ai-analysis.txt

      # ---------------------------------------
      # Fail if the AI agent could not repair the code
      # ---------------------------------------
      - name: Fail if AI agent could not repair the code
        if: steps.tests.outcome == 'failure' && steps.agent.outcome != 'success'
        run: |
          echo "GenAI agent could not safely fix the problem."
          exit 1
          git config user.name "GenAI DevOps Agent"
