name: GenAI DevOps Agent

on:
  workflow_dispatch:

  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-devops:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phase-3/genai-devops-demo
    steps:

      # --------------------------------
      # 1. Checkout repository
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------
      # 2. Setup Python
      # --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------
      # 3. Install dependencies
      # --------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------
      # 4. Run AI remediation agent
      # --------------------------------

      - name: Run GenAI DevOps Agent
        id: agent
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.5
        run: |
          python run_agent.py

      # --------------------------------
      # 5. Check whether AI fixed it
      # --------------------------------

      - name: Check AI result
        if: steps.agent.outcome == 'success'
        run: |
          echo "AI successfully fixed the issue."

      # --------------------------------
      # 6. Show changed files
      # --------------------------------

      - name: Show changes
        if: steps.agent.outcome == 'success'
        run: |
          git status
          git diff

      # --------------------------------
      # 7. Create AI branch
      # --------------------------------

      - name: Create AI branch
        if: steps.agent.outcome == 'success'
        run: |
          BRANCH="ai-fix-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH"

          git config user.name "GenAI DevOps Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.py

          git commit -m "fix: AI generated CI remediation"

          git push origin "$BRANCH"

          echo "AI_BRANCH=$BRANCH" >> "$GITHUB_ENV"


      # --------------------------------
      # 8. Create Pull Request
      # --------------------------------

      - name: Create Pull Request
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          gh pr create \
            --base main \
            --head "$AI_BRANCH" \
            --title "🤖 AI generated CI fix" \
            --body "## GenAI DevOps Agent

            The CI pipeline failed.

            The GenAI agent:

            1. Analyzed the failure.
            2. Identified the probable root cause.
            3. Generated a code fix.
            4. Applied the fix.
            5. Ran the test suite.
            6. Confirmed that the tests passed.

            Please review the generated code before merging."


      # --------------------------------
      # 9. Fail workflow if AI failed
      # --------------------------------

      - name: Fail if AI could not fix
        if: steps.agent.outcome != 'success'
        run: |
          echo "AI agent could not safely resolve the failure."
          exit 1
