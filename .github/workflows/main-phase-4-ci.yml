name: Real tool using GenAI DevOps Agent

on:
  workflow_dispatch:

  pull_request:

permissions:
  contents: write
  pull-requests: write


jobs:

  ai-devops-agent:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phase-4/genai-devops-demo

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # Dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # Run original tests
      # ==========================================

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          pytest -v 2>&1 | tee ci-output.txt


      # ==========================================
      # Start AI Agent
      # ==========================================

      - name: Run GenAI Agent
        if: steps.tests.outcome == 'failure'
        id: agent
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.5
        run: |
          python agent.py < ci-output.txt


      # ==========================================
      # Check changes
      # ==========================================

      - name: Show AI changes
        if: steps.agent.outcome == 'success'
        run: |
          echo "Git status:"
          git status

          echo ""
          echo "Git diff:"
          git diff


      # ==========================================
      # Create branch
      # ==========================================

      - name: Create AI branch
        if: steps.agent.outcome == 'success'
        run: |

          BRANCH="ai-fix-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH"

          git config user.name "GenAI DevOps Agent"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.py

          git commit \
            -m "fix: AI generated CI remediation"

          git push origin "$BRANCH"

          echo "AI_BRANCH=$BRANCH" >> "$GITHUB_ENV"


      # ==========================================
      # Create Pull Request
      # ==========================================

      - name: Create Pull Request
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          gh pr create \
            --base main \
            --head "$AI_BRANCH" \
            --title "🤖 GenAI automated fix" \
            --body "## GenAI DevOps Agent

          The CI pipeline failed.

          The AI agent:

          - Investigated repository files
          - Analyzed CI logs
          - Identified the probable root cause
          - Modified application code
          - Ran tests
          - Generated this pull request

          Please review the changes before merging."


      # ==========================================
      # Fail if AI couldn't solve it
      # ==========================================

      - name: Fail pipeline
        if: steps.agent.outcome != 'success'
        run: |
          echo "GenAI agent could not safely fix the problem."
          exit 1